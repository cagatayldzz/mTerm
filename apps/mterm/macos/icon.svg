<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2c33"/>
      <stop offset="1" stop-color="#0d0d11"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shape"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" opacity="0.45" filter="url(#soft)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>

  <g clip-path="url(#shape)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- history sidebar -->
    <rect x="100" y="100" width="236" height="824" fill="#ffffff" opacity="0.045"/>
    <rect x="335" y="100" width="3" height="824" fill="#ffffff" opacity="0.08"/>
    <rect x="152" y="236" width="132" height="20" rx="10" fill="#ffffff" opacity="0.30"/>
    <rect x="152" y="296" width="98" height="20" rx="10" fill="#ffffff" opacity="0.20"/>
    <rect x="152" y="356" width="118" height="20" rx="10" fill="#ffffff" opacity="0.20"/>
    <rect x="152" y="416" width="78" height="20" rx="10" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- prompt: > _ -->
  <polyline points="446,420 576,512 446,604" fill="none" stroke="url(#prompt)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="624" y="588" width="170" height="58" rx="29" fill="url(#prompt)"/>

  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
